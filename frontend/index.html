<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Genie — Subcontractor Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            slate: {
              850: '#172033',
              950: '#0a1120',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #0f172a; color: #f1f5f9; font-family: 'Inter', system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    .nav-item { transition: background 0.15s, color 0.15s; }
    .nav-item.active { background: #4f46e5; color: #fff; }
    .nav-item:not(.active):hover { background: #1e293b; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; }
    .btn-primary { background: #4f46e5; color: #fff; border-radius: 0.5rem; padding: 0.5rem 1.25rem; font-weight: 600; transition: background 0.15s; cursor: pointer; }
    .btn-primary:hover { background: #4338ca; }
    .btn-primary:disabled { background: #3730a3; opacity: 0.6; cursor: not-allowed; }
    .btn-ghost { background: transparent; color: #94a3b8; border: 1px solid #334155; border-radius: 0.5rem; padding: 0.5rem 1.25rem; font-weight: 500; transition: all 0.15s; cursor: pointer; }
    .btn-ghost:hover { background: #1e293b; color: #f1f5f9; }
    .input { background: #0f172a; border: 1px solid #334155; border-radius: 0.5rem; color: #f1f5f9; padding: 0.5rem 0.75rem; outline: none; width: 100%; }
    .input:focus { border-color: #6366f1; }
    .input option { background: #1e293b; }
    table { width: 100%; border-collapse: collapse; }
    thead th { text-align: left; padding: 0.75rem 1rem; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; border-bottom: 1px solid #334155; }
    tbody tr { border-bottom: 1px solid #1e293b; transition: background 0.1s; }
    tbody tr:hover { background: #1e293b; cursor: pointer; }
    tbody td { padding: 0.875rem 1rem; font-size: 0.875rem; color: #cbd5e1; }
    .tab-btn { padding: 0.5rem 1rem; font-size: 0.875rem; font-weight: 500; border-bottom: 2px solid transparent; color: #64748b; cursor: pointer; transition: all 0.15s; }
    .tab-btn.active { color: #6366f1; border-bottom-color: #6366f1; }
    .tab-btn:hover:not(.active) { color: #94a3b8; }
    .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9999; min-width: 300px; max-width: 480px; padding: 1rem 1.25rem; border-radius: 0.75rem; font-size: 0.875rem; box-shadow: 0 4px 24px rgba(0,0,0,0.5); animation: slideIn 0.25s ease; }
    @keyframes slideIn { from { transform: translateY(1rem); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; display: flex; align-items: center; justify-content: center; }
    .modal { background: #1e293b; border: 1px solid #334155; border-radius: 1rem; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; padding: 1.75rem; }
    .pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .spinner { width: 20px; height: 20px; border: 2px solid #4f46e5; border-top-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .skill-chip { display: inline-block; background: #1e3a5f; color: #93c5fd; font-size: 0.7rem; font-weight: 600; border-radius: 9999px; padding: 0.15rem 0.6rem; margin: 0.1rem; }
    .empty-state { text-align: center; padding: 4rem 2rem; color: #475569; }
    .agent-chip { display: inline-block; font-size: 0.7rem; font-weight: 700; border-radius: 9999px; padding: 0.2rem 0.65rem; text-transform: uppercase; letter-spacing: 0.05em; }
  </style>
</head>
<body class="flex h-screen overflow-hidden">

  <!-- Sidebar -->
  <aside class="w-60 flex-shrink-0 flex flex-col border-r border-slate-700 bg-slate-900" style="background:#0f172a">
    <!-- Logo -->
    <div class="px-6 py-5 border-b border-slate-700">
      <div class="flex items-center gap-2">
        <span class="text-2xl">⚡</span>
        <span class="text-xl font-bold text-indigo-400">Genie</span>
      </div>
      <p class="text-xs text-slate-500 mt-1">Subcontractor Manager</p>
    </div>

    <!-- Nav -->
    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
      <a href="#dashboard" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-300">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
        Dashboard
      </a>
      <a href="#jobs" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-300">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
        Jobs
      </a>
      <a href="#subcontractors" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-300">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        Subcontractors
      </a>
      <a href="#schedule" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-300">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        Schedule
      </a>
      <a href="#risks" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-300">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        Risks
      </a>
      <a href="#logs" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-300">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
        Agent Logs
      </a>
    </nav>

    <!-- Footer -->
    <div class="px-5 py-4 border-t border-slate-700">
      <div id="server-status" class="flex items-center gap-2 text-xs text-slate-500">
        <span class="w-2 h-2 rounded-full bg-slate-500"></span>
        Connecting…
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 flex flex-col overflow-hidden">
    <!-- Top bar -->
    <header class="flex items-center justify-between px-8 py-4 border-b border-slate-700 flex-shrink-0" style="background:#0f172a">
      <div id="page-title" class="text-xl font-semibold text-slate-100">Dashboard</div>
      <div class="flex items-center gap-3">
        <span class="text-xs text-slate-500">API: localhost:8000</span>
        <a href="http://localhost:8000/docs" target="_blank" class="btn-ghost text-xs py-1.5 px-3">Swagger Docs ↗</a>
      </div>
    </header>

    <!-- Content -->
    <div id="main-content" class="flex-1 overflow-y-auto p-8">
      <div class="empty-state">
        <div class="spinner mx-auto mb-4" style="width:32px;height:32px"></div>
        <p>Loading…</p>
      </div>
    </div>
  </main>

  <!-- Toast container (rendered by JS) -->
  <div id="toast-container"></div>

  <!-- Scripts (order matters) -->
  <script type="module">
    import { initApp } from './js/app.js';
    initApp();
  </script>
</body>
</html>
